name: fog_cue
description: "FoG Cue: coleta de IMU e pistas sensoriais para pesquisa sobre Freezing of Gait (TCC)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  clock: ^1.1.3
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^3.1.22
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  sqflite: ^2.4.4+1
  vibration: ^3.2.1
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
